server {
  listen 8888 default_server;

  server_name _;

  # the frontend is server-rendered PHP + Alpine.js; entry script is index.php
  root /app/api/web;
  index index.php;

  # static assets (alpine.min.js, app.css, module-*.js) served directly
  location /assets/ {
    try_files $uri =404;
  }

  # everything else goes to the Yii2 entry script (pretty URLs)
  location / {
    try_files $uri $uri/ /index.php?$query_string;
  }

  location ~ \.php$ {
    fastcgi_pass 127.0.0.1:9000;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
  }
}
